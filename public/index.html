<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <title>GW2 WB Notifier</title>
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="stylesheet" href="/css/estilos.css" />
</head>

<body>
    <h2>GW2 Select World Bosses and Timers</h2>
    <div>
        <div class="button-container">
            <label for="filtroExpansion">Expansion:</label>
            <select id="filtroExpansion">
                <option value="all">All</option>
                <option value="Core">Core</option>
                <option value="IBS">IBS</option>
                <option value="JW">JW</option>
                <option value="VoE">VoE</option>
            </select>
            <label for="minutosAviso">⏰ Notify before: </label>
            <span style="display: flex; align-items: center; gap: 4px;">
                <input type="number" id="minutosAviso" min="1" max="59" value="10" />
                <span>min</span>
            </span>
            <button type="button" id="btn-borrar">🧹 Clear all selected bosses</button>
            <button type="button" id="btn-borrar-total">🗑️ Reset all settings</button>
            <button type="button" id="btn-destacar">🌟 Highlight upcoming bosses</button>
        </div>
        <div class="jefe-grid" id="checkbox-container">Loading bosses...</div><br />
    </div>

    <script>
        const checkboxContainer = document.getElementById('checkbox-container');
        const minutosAvisoInput = document.getElementById('minutosAviso');
        const filtroExpansion = document.getElementById("filtroExpansion");
        let checkboxes = [];
        let seleccionGuardada = {};
        minutosAvisoInput.addEventListener('change', () => {
            let minutosAviso = parseInt(minutosAvisoInput.value, 10);
            if (isNaN(minutosAviso) || minutosAviso < 1 || minutosAviso > 59) {
                minutosAviso = 10;
                minutosAvisoInput.value = minutosAviso;
            }
            localStorage.setItem('minutosAviso', minutosAviso);
            guardarEnServidor(seleccionGuardada, minutosAviso);
        });
        filtroExpansion.addEventListener('change', cargarJefes);

        async function cargarConfiguracion() {
            try {
                const res = await fetch('/api/config');
                const config = await res.json();
                seleccionGuardada = config.seleccion || {};
                minutosAvisoInput.value = config.minutosAviso ?? 10;
                // Sincronizar localStorage con backend para evitar discrepancias
                localStorage.setItem('seleccionBossesHoras', JSON.stringify(seleccionGuardada));
                localStorage.setItem('minutosAviso', minutosAvisoInput.value);
            } catch (error) {
                console.warn('No se pudo cargar la configuracion del servidor.', error);
                seleccionGuardada = {};
                minutosAvisoInput.value = 10;
            }
        }

        function actualizarSeleccionBoss(nombreBoss, hora, marcado) {
            if (!seleccionGuardada[nombreBoss]) {
                seleccionGuardada[nombreBoss] = [];
            }
            if (marcado) {
                if (!seleccionGuardada[nombreBoss].includes(hora)) {
                    seleccionGuardada[nombreBoss].push(hora);
                }
            } else {
                seleccionGuardada[nombreBoss] =
                    seleccionGuardada[nombreBoss].filter(h => h !== hora);

                if (seleccionGuardada[nombreBoss].length === 0) {
                    delete seleccionGuardada[nombreBoss];
                }
            }
            localStorage.setItem(
                'seleccionBossesHoras',
                JSON.stringify(seleccionGuardada)
            );
            guardarEnServidor(seleccionGuardada, parseInt(minutosAvisoInput.value, 10));
        }

        async function cargarJefes() {
            try {
                const res = await fetch('/api/jefes');
                const jefes = await res.json();
                checkboxContainer.innerHTML = '';
                checkboxes = [];

                const expansionSeleccionada = filtroExpansion.value;

                const jefesFiltrados = expansionSeleccionada === "all"
                    ? jefes
                    : jefes.filter(j =>
                        j.expansiones.includes(expansionSeleccionada)
                    );

                jefesFiltrados.forEach(jefe => {
                    const div = document.createElement('div');
                    div.classList.add('jefe-container');
                    div.dataset.jefe = jefe.nombre;

                    const titulo = document.createElement('strong');
                    titulo.textContent = jefe.nombre;
                    div.appendChild(titulo);
                    div.appendChild(document.createElement('br'));

                    jefe.horarios.forEach(hora => {
                        const id = `${jefe.nombre}-${hora}`;
                        const label = document.createElement('label');
                        label.htmlFor = id;

                        const input = document.createElement('input');
                        input.type = 'checkbox';
                        input.id = id;
                        input.name = `horas-${jefe.nombre}`;
                        input.value = hora;

                        if (seleccionGuardada[jefe.nombre]?.includes(hora)) {
                            input.checked = true;
                        }

                        input.addEventListener('change', () => {
                            // guardarSeleccion(); // con esto ya autoguarda
                            actualizarSeleccionBoss(jefe.nombre, hora, input.checked);
                            actualizarResaltadoBosses();
                        });

                        label.appendChild(input);
                        label.append(` ${hora}`);
                        div.appendChild(label);
                        div.appendChild(document.createElement('br'));
                        checkboxes.push(input);
                    });

                    // Boton para copiar WP
                    const btnCopiar = document.createElement('button');
                    btnCopiar.type = 'button';
                    btnCopiar.style.cursor = 'pointer';
                    btnCopiar.textContent = '📋 Copy WP';
                    btnCopiar.addEventListener('click', () => {
                        // Solo copiar las horas seleccionadas
                        //const horasSeleccionadas = [...div.querySelectorAll('input[type="checkbox"]:checked')]
                            //.map(cb => cb.value)
                            //.join(', ') || 'Sin seleccion';
                        
                        const texto = `${jefe.nombre}: ${jefe.puntoRuta || 'N/A'}`;

                        const textArea = document.createElement("textarea");
                        textArea.value = texto;
                        // Para que no haga scroll hacia abajo del todo
                        textArea.style.position = "fixed";
                        textArea.style.opacity = "0";
                        textArea.style.pointerEvents = "none";
                        
                        document.body.appendChild(textArea);
                        textArea.focus();
                        textArea.select();

                        /*navigator.clipboard.writeText(texto)
                            .then(() => {
                                btnCopiar.textContent = '✅ Copied!';
                                setTimeout(() => btnCopiar.textContent = '📋 Copy WP', 1500);
                            })
                            .catch(err => {
                                console.error('Copy error:', err);
                                alert('❌ Can not copy to clipboard.');
                            });*/
                        
                        try {
                            const success = document.execCommand('copy');
                            if (success) {
                                btnCopiar.textContent = '✅ Copied!';
                                setTimeout(() => btnCopiar.textContent = '📋 Copy WP', 1500);
                            } else {
                                alert('❌ Could not copy. Please press Ctrl+C to copy manually.');
                            }
                        } catch (err) {
                            console.error('Copy error:', err);
                            alert('❌ Copy not supported on this browser.');
                        }
                        document.body.removeChild(textArea);
                    });

                    div.appendChild(btnCopiar);

                    // Para borrar solo la seleccion de cada jefe
                    const btnBorrarJefe = document.createElement('button');
                    btnBorrarJefe.type = 'button';
                    btnBorrarJefe.style.cursor = 'pointer';
                    btnBorrarJefe.textContent = '🗑️ Clear';
                    btnBorrarJefe.addEventListener('click', () => {
                        // Desmarcar todos los checkboxes de este jefe
                        div.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.checked = false);
                        delete seleccionGuardada[jefe.nombre];
                        localStorage.setItem(
                            'seleccionBossesHoras',
                            JSON.stringify(seleccionGuardada)
                        );
                        guardarEnServidor(seleccionGuardada, parseInt(minutosAvisoInput.value, 10));
                        actualizarResaltadoBosses();
                        alert(`✅ Cleared boss: ${jefe.nombre}`);
                    });

                    div.appendChild(document.createElement('br'));
                    div.appendChild(btnBorrarJefe);

                    checkboxContainer.appendChild(div);
                    checkboxContainer.appendChild(document.createElement('hr'));
                });

                actualizarResaltadoBosses();

                if (modoDestacadoActivo) {
                    setTimeout(() => {
                        aplicarDestacadoHoras();
                    }, 0);
                }

            } catch (error) {
                checkboxContainer.innerHTML = '❌ Error loading bosses.';
                console.error(error);
            }
        }

        const btnBorrar = document.getElementById('btn-borrar');
        btnBorrar.title = "Clear the current selection of all bosses";
        btnBorrar.addEventListener('click', () => {
            checkboxes.forEach(cb => cb.checked = false);
            // Borrar todas las horas seleccionadas
            seleccionGuardada = {};
            localStorage.setItem('seleccionBossesHoras', JSON.stringify(seleccionGuardada));
            guardarEnServidor(seleccionGuardada, parseInt(minutosAvisoInput.value, 10));
            actualizarResaltadoBosses();
            alert("✅ Current selected bosses have been cleared.");
        });

        const btnBorrarTotal = document.getElementById('btn-borrar-total');
        btnBorrarTotal.title = "Clear the current selection of all bosses and sets notify before 10 minutes";
        btnBorrarTotal.addEventListener('click', () => {
            checkboxes.forEach(cb => cb.checked = false);
            // Borrar toda la seleccion y restaurar minutos
            seleccionGuardada = {};
            minutosAvisoInput.value = 10;
            localStorage.setItem('seleccionBossesHoras', JSON.stringify(seleccionGuardada));
            localStorage.setItem('minutosAviso', minutosAvisoInput.value);
            guardarEnServidor(seleccionGuardada, parseInt(minutosAvisoInput.value, 10));
            actualizarResaltadoBosses();
            // Si el modo highlight estaba activo, apagarlo
            if (modoDestacadoActivo) {
                quitarDestacadoHoras()
            }
            alert("✅ ALL selections have been cleared.");
        });

        let modoDestacadoActivo = false; // para saber si el modo highlight esta activo
        const margenMin = -5; // minutos antes (si es negativo) de la hora actual
        const margenMax = 30; // minutos despues de la hora actual, no puede ser menor al margen minimo

        document.getElementById('btn-destacar').addEventListener('click', destacarHorasProximas);

        function actualizarTextoBoton() {
            const boton = document.getElementById('btn-destacar');
            if (modoDestacadoActivo) {
                boton.textContent = '❌ Remove highlights';
            } else {
                boton.textContent = `🌟 Manual highlight upcoming bosses`;
                const ahora = new Date();
                // Crear las fechas de inicio y fin segun los rangos
                const inicio = new Date(ahora.getTime() + margenMin * 60 * 1000);
                const fin = new Date(ahora.getTime() + margenMax * 60 * 1000);
                let textoRango;
                if (margenMin < 0) {
                    textoRango = `Range: from ${formatearHora(inicio)} (${margenMin} min before now) to ${formatearHora(fin)} (+${margenMax} min after now)`;
                } else {
                    textoRango = `Range: from ${formatearHora(inicio)} (now +${margenMin} min) to ${formatearHora(fin)} (now +${margenMax} min)`;
                }
                boton.title = textoRango;
            }
        }

        // Formatear la hora (HH:MM)
        function formatearHora(fecha) {
            return fecha.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        // Para destacar horas
        function aplicarDestacadoHoras() {
            // Quitar resaltados anteriores por si acaso
            document.querySelectorAll('label.destacado')
                .forEach(lbl => lbl.classList.remove('destacado'));

            // Detectar si el margenMin es negativo (modo bidireccional)
            const modoBidireccional = margenMin < 0;

            const ahora = new Date();
            const minutosActuales = ahora.getHours() * 60 + ahora.getMinutes();

            // Revisar todas las horas (labels)
            document.querySelectorAll('.jefe-container label').forEach(label => {

                const hora = label.textContent.trim().match(/^\d{2}:\d{2}$/);
                if (!hora) return;

                const [h, m] = hora[0].split(':').map(Number);
                const minutosEvento = h * 60 + m;

                let diff = minutosEvento - minutosActuales;

                if (modoBidireccional) {
                    // Permite margenes negativos y positivos (±12h)
                    if (diff > 720) diff -= 1440;
                    if (diff < -720) diff += 1440;
                } else {
                    // Solo futuros (ajuste simple a 0–24h)
                    if (diff < 0) diff += 1440; // si ya paso, cuenta como del dia siguiente
                }

                if (diff >= margenMin && diff <= margenMax) {
                    label.classList.add('destacado');
                }
            });
        }

        function destacarHorasProximas() {
            if (modoDestacadoActivo) {
                document.querySelectorAll('label.destacado')
                    .forEach(lbl => lbl.classList.remove('destacado'));
                modoDestacadoActivo = false;

            } else {
                modoDestacadoActivo = true;
                aplicarDestacadoHoras();
            }
            actualizarTextoBoton();
        }

        function quitarDestacadoHoras() {
            document.querySelectorAll('label.destacado')
                .forEach(lbl => lbl.classList.remove('destacado'));

            modoDestacadoActivo = false;
            actualizarTextoBoton();
        }

        function actualizarResaltadoBosses() {
            document.querySelectorAll('.jefe-container').forEach(div => {
                const titulo = div.querySelector('strong');
                const nombre = div.dataset.jefe;

                if (seleccionGuardada[nombre]?.length > 0) {
                    titulo.classList.add('boss-selected');
                } else {
                    titulo.classList.remove('boss-selected');
                }
            });
        }

        function guardarEnServidor(seleccion, minutosAviso) {
            fetch('/guardar-config', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    seleccion,
                    minutosAviso
                })
            }).catch(err => console.error("Save error:", err));
        }

        async function iniciarApp() {
            await cargarConfiguracion();
            await cargarJefes();
        }

        actualizarTextoBoton();
        iniciarApp();
        
    </script>
</body>

</html>
